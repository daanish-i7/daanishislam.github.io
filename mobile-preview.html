<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daanish Islam — phone preview</title><style>*{box-sizing:border-box}body{margin:0;background:#080b0d;color:#e7eae9;font:15px system-ui,sans-serif}header{display:flex;gap:18px;align-items:center;justify-content:center;padding:18px;flex-wrap:wrap}select,a{background:#182126;color:#eee;border:1px solid #526168;padding:10px;text-decoration:none;font:inherit;min-height:44px}main{display:flex;justify-content:center;padding:0 12px 32px}iframe{display:block;width:390px;height:844px;max-width:100%;border:0;outline:1px solid #526168;border-radius:8px;background:#0c0e0f;box-shadow:0 10px 80px #0008}label{display:flex;gap:10px;align-items:center}</style></head><body><header><strong>Mobile preview</strong><label>Screen <select id="screen"><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="375,667">375 × 667</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390 · landscape</option></select></label><a href="index.html">Open full website ↗</a></header><main><iframe src="index.html" title="Responsive mobile portfolio" id="preview"></iframe></main><script>document.querySelector('#screen').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const f=document.querySelector('#preview');f.style.width=w+'px';f.style.height=h+'px'});</script></body></html>
